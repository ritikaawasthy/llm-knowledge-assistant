version: "3.9"

services:
  web:
    build: .
    container_name: knowledge_api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./vector_store:/app/vector_store
      - ./staticfiles:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 llm_kb.wsgi:application"

